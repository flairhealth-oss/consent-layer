name: consent_layer
description: >-
  A field-definable consent enforcement primitive for Flutter apps.
  Detects schema changes, presents per-field consent review, and produces
  an auditable ConsentState. The caller enforces withdrawn-field substitution.
version: 1.0.1
homepage: https://github.com/flairhealth-oss/consent-layer
repository: https://github.com/flairhealth-oss/consent-layer
issue_tracker: https://github.com/flairhealth-oss/consent-layer/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
